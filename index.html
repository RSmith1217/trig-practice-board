<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exact Trig | Practice Board</title><meta name="description" content="Exact trig practice for Precalculus Honors, with unit-circle diagrams and principal ranges."></head><body><div id="trig-board">
<style>
#trig-board{color-scheme:light dark;background:light-dark(#ffffff,#17191d);color:light-dark(#18222c,#f2f5f8);font-family:Arial,sans-serif;padding:24px;border-radius:12px}
#trig-board *{box-sizing:border-box}#trig-board header{padding-right:80px;margin-bottom:22px}#trig-board h2{font-size:24px;font-weight:500;margin:0 0 6px}#trig-board .sub{font-size:15px;color:light-dark(#4b5968,#bdc7d2)}
#trig-board .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end}#trig-board label{display:flex;flex-direction:column;gap:6px;font-size:14px}#trig-board select,#trig-board button{font:inherit;color:inherit;background:light-dark(#f3f5f7,#292e35);border:1px solid light-dark(#bac4cf,#646e79);border-radius:7px;padding:11px;min-height:44px;max-width:100%}#trig-board .skill{flex:1;min-width:200px}#trig-board button{cursor:pointer}#trig-board button.primary{background:light-dark(#183f66,#d8eaff);color:light-dark(#fff,#132b43);border-color:transparent}#trig-board .stage{text-align:center;padding:40px 0 30px;min-height:310px}#trig-board .instruction{font-size:22px;margin-bottom:25px}#trig-board .math{font-size:clamp(34px,6vw,62px);overflow-wrap:anywhere}#trig-board .answer{font-size:clamp(28px,4vw,44px);min-height:80px;padding-top:24px;color:light-dark(#205641,#a8e5c8)}#trig-board .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}#trig-board .status{margin-top:18px;text-align:center;font-size:14px;color:light-dark(#4b5968,#bdc7d2)}#trig-board math{font-family:STIX Two Math,Cambria Math,serif}#trig-board [hidden]{display:none!important}@media(max-width:480px){#trig-board{padding:16px}#trig-board header{padding-right:0}#trig-board .stage{padding-top:28px}.controls label{width:100%}}

html,body{margin:0;min-height:100%;background:#f5f4ef}#trig-board{color-scheme:light;max-width:1500px;margin:auto;border-radius:0;min-height:100vh;padding:32px 4vw;background:#f5f4ef;color:#152c36}#trig-board header{position:relative;padding-right:150px;border-bottom:1px solid #ccd3d0;padding-bottom:24px}#trig-board h2{font-size:30px;margin-top:10px}#trig-board .eyebrow{font-size:12px;font-weight:bold;letter-spacing:2px;color:#426c66}#trig-board .fullscreen{position:absolute;right:0;top:0}#trig-board .controls{margin-top:26px}#trig-board .lesson{display:flex;align-items:center;gap:30px;min-height:400px}#trig-board .stage{flex:1;min-width:0}#trig-board aside{width:40%;max-width:460px;border-left:1px solid #ccd3d0;padding:20px}#trig-board aside svg{display:block;width:100%;max-height:340px}#trig-board aside p{font-size:17px;line-height:1.5;text-align:center}#trig-board .diagram-control{text-align:center;margin-top:16px}#trig-board .status{padding-bottom:20px}#trig-board button:hover{filter:brightness(.95)}#trig-board select:focus-visible,#trig-board button:focus-visible{outline:3px solid #b36922;outline-offset:3px}#trig-board .hint{font-size:13px;text-align:center;color:#52666e;margin-top:12px}#trig-board:fullscreen{max-width:none;overflow:auto}#trig-board .math{font-size:clamp(38px,5vw,76px)}@media(max-width:760px){#trig-board .lesson{display:block}#trig-board aside{width:100%;max-width:none;border-left:0;border-top:1px solid #ccd3d0}#trig-board aside svg{max-height:280px}#trig-board header{padding-right:0;padding-top:48px}#trig-board .math{font-size:clamp(30px,6vw,56px)}}
</style>
<header><div class="eyebrow"><a href="https://dydxmath.com/" style="color:inherit">← DYDX MATH</a> / CLASSROOM PRACTICE</div><h2>Exact trig • Practice board</h2><div class="sub">Precalculus Honors · No calculator · Angles in radians</div><button id="tb-fullscreen" class="fullscreen" type="button">Full screen ⛶</button></header>
<div class="controls">
<label class="skill">Skill<select id="tb-skill"></select></label>
<label id="tb-fn-label">Function<select id="tb-fn"><option value="sin">sin</option><option value="cos">cos</option><option value="tan">tan</option></select></label>
<label>Problem<select id="tb-item"></select></label>
</div>
<div class="lesson"><div class="stage" aria-live="polite"><div class="instruction" id="tb-instruction"></div><div class="math" id="tb-question"></div><div class="answer" id="tb-answer"></div></div>
<aside id="tb-diagram" hidden aria-live="polite"></aside></div><div class="actions"><button id="tb-prev" type="button">← Previous</button><button id="tb-reveal" class="primary" type="button">Reveal answer</button><button id="tb-next" type="button">Next →</button><button id="tb-random" type="button">Random problem</button></div>
<div class="diagram-control"><button id="tb-toggle-diagram" type="button" aria-pressed="false">Show diagram</button></div><div class="status" id="tb-status"></div><div class="hint">Space: answer · ← / →: navigate · R: random · D: diagram</div>
<script>
(()=>{
const root=document.getElementById('trig-board'),get=id=>root.querySelector('#tb-'+id);
const angles=[[2,3],[11,6],[5,4],[7,6],[3,4],[5,3],[-1,3],[-3,4],[-5,6],[11,4],[13,6],[1,1],[3,2],[0,1],[5,2]];
const names=['1 · Radians → degrees','2 · Reference angle','3 · Quadrant or axis','4 · Sign only','5 · Reference-angle values','6 · Full trig evaluation','7 · Inverse trig values','8 · Matching: trig outside','9 · Matching: inverse outside','10 · Mixed: trig outside','11 · Mixed: inverse outside'];
const instructions=['Convert to degrees.','Find the reference angle.','Locate the terminal side.','Positive, negative, zero, or undefined?','Evaluate exactly.','Evaluate exactly.','Give the principal angle.','Evaluate over the real numbers.','Give the principal angle.','Evaluate exactly.','Give the principal angle, if defined.'];
const mi=s=>'<mi>'+s+'</mi>',mn=s=>'<mn>'+s+'</mn>',mo=s=>'<mo>'+s+'</mo>',row=s=>'<mrow>'+s+'</mrow>',frac=(a,b)=>'<mfrac>'+row(a)+row(b)+'</mfrac>',sqrt=n=>'<msqrt>'+mn(n)+'</msqrt>',math=s=>'<math xmlns="http://www.w3.org/1998/Math/MathML">'+row(s)+'</math>';
function gcd(a,b){return b?gcd(b,a%b):a}function rat(n,d=1){if(n===0)return mn(0);const g=gcd(Math.abs(n),d);n/=g;d/=g;return(n<0?mo('−'):'')+(d===1?mn(Math.abs(n)):frac(mn(Math.abs(n)),mn(d)))}
function pi(n,d=1){if(!n)return mn(0);const g=gcd(Math.abs(n),d);n/=g;d/=g;let a=(Math.abs(n)===1?'':mn(Math.abs(n)))+mi('π');return(n<0?mo('−'):'')+(d===1?a:frac(a,mn(d)))}
const call=(f,a)=>mi(f)+mo('(')+row(a)+mo(')');
const exacts=[[0,mn(0)],[1,mn(1)],[0.5,frac(mn(1),mn(2))],[Math.sqrt(2)/2,frac(sqrt(2),mn(2))],[Math.sqrt(3)/2,frac(sqrt(3),mn(2))],[Math.sqrt(3),sqrt(3)],[1/Math.sqrt(3),frac(sqrt(3),mn(3))],[2,mn(2)]];
function exact(x){if(!Number.isFinite(x))return null;const e=exacts.find(e=>Math.abs(e[0]-Math.abs(x))<1e-8);if(!e)throw Error('Unmapped value '+x);return(x< -1e-8?mo('−'):'')+e[1]}
function trig(f,x){if(f==='tan'&&Math.abs(Math.cos(x))<1e-8)return NaN;return Math[f](x)}
function inv(f,x){if(!Number.isFinite(x))return NaN;if(f!=='tan'&&Math.abs(x)>1+1e-8)return NaN;return Math['a'+f](f==='tan'?x:Math.max(-1,Math.min(1,x)))}
function angleAnswer(x){return Number.isFinite(x)?math(pi(Math.round(x/Math.PI*12),12)):'Undefined over the reals'}
const inverse=[['sin',-.5],['cos',-.5],['tan',-Math.sqrt(3)],['sin',Math.sqrt(2)/2],['cos',Math.sqrt(3)/2],['tan',1/Math.sqrt(3)],['sin',-1],['cos',-1],['tan',0],['sin',1],['cos',0],['tan',-1],['sin',-Math.sqrt(3)/2],['cos',Math.sqrt(2)/2],['tan',Math.sqrt(3)]];
const matching=[['sin',1,2],['cos',-3,5],['tan',4,1],['sin',-1,1],['cos',1,1],['tan',-7,3],['sin',0,1],['cos',0,1],['tan',0,1],['sin',3,2],['cos',-5,4],['tan',-12,1],['sin',-4,5],['cos',-1,1],['tan',2,5]];
const reverse=[['sin',5,6],['cos',7,6],['tan',2,3],['sin',-5,4],['cos',-1,3],['tan',7,4],['sin',13,6],['cos',11,4],['tan',-4,3],['sin',3,2],['cos',5,2],['tan',3,4],['sin',-1,6],['cos',2,3],['tan',1,2]];
const mixed=[['cos','sin',3,5,rat(4,5)],['cos','sin',-3,5,rat(4,5)],['sin','cos',-5,13,rat(12,13)],['sin','cos',5,13,rat(12,13)],['tan','sin',-5,13,rat(-5,12)],['tan','cos',-3,5,rat(-4,3)],['sin','tan',3,4,rat(3,5)],['cos','tan',-3,4,rat(4,5)],['sin','tan',-5,12,rat(-5,13)],['cos','tan',12,5,rat(5,13)],['tan','sin',0,1,mn(0)],['sin','cos',-1,1,mn(0)],['cos','sin',1,1,mn(0)],['tan','cos',0,1,null],['cos','sin',4,5,rat(3,5)]];
const mixedReverse=[['sin','cos',5,6],['cos','sin',7,6],['tan','sin',3,2],['sin','cos',-1,3],['cos','sin',3,4],['tan','cos',1,1],['sin','tan',3,4],['cos','tan',1,4],['sin','cos',4,3],['cos','sin',11,6],['tan','cos',2,1],['sin','tan',1,3],['cos','tan',1,2],['sin','cos',11,4],['cos','sin',-1,2]];
let skill=0,index=0,revealed=false,answer='',diagramVisible=false,diagAngle=0,diagFunction='sin',diagInverse=false,bag=[];
names.forEach((s,i)=>get('skill').add(new Option(s,i)));angles.forEach((a,i)=>get('item').add(new Option(String(i+1).padStart(2,'0')+' · '+(a[0]===0?'0':(a[0]===1?'':a[0]===-1?'−':a[0])+'π'+(a[1]===1?'':'/'+a[1])),i)));
function draw(){let q='',a='',f=get('fn').value;const [n,d]=angles[index],r=n/d,t=r*Math.PI,u=((r%2)+2)%2;
diagAngle=t;diagFunction=f;diagInverse=false;get('fn-label').hidden=!(skill>=3&&skill<=5);get('instruction').textContent=instructions[skill];
while(get('item').options.length>(skill===4?9:15))get('item').remove(get('item').options.length-1);while(get('item').options.length<(skill===4?9:15))get('item').add(new Option('',get('item').options.length));for(let i=0;i<(skill===4?9:15);i++)get('item').options[i].textContent=String(i+1).padStart(2,'0')+(skill<=3||skill===5?' · '+(angles[i][0]===0?'0':(angles[i][0]===1?'':angles[i][0]===-1?'−':angles[i][0])+'π'+(angles[i][1]===1?'':'/'+angles[i][1])):'');
if(skill<3){q=pi(n,d);if(skill===0)a=math(mn(n*180/d)+mo('°'));if(skill===1){const v=u%1,ref=Math.min(v,1-v);a=(Math.abs(u*2-Math.round(u*2))<1e-8)?'No acute reference angle (axis)':math(pi(Math.round(ref*12),12))}if(skill===2){a=Math.abs(u*2-Math.round(u*2))<1e-8?['Positive x-axis','Positive y-axis','Negative x-axis','Negative y-axis'][Math.round(u*2)%4]:'Quadrant '+['I','II','III','IV'][Math.floor(u*2)]}}
else if(skill<=5){let nn=n,dd=d;if(skill===4){nn=[1,1,1][index%3];dd=[6,4,3][index%3];f=['sin','cos','tan'][Math.floor(index/3)%3];get('fn').value=f;get('fn-label').hidden=true;}diagAngle=nn/dd*Math.PI;diagFunction=f;q=call(f,pi(nn,dd));const v=trig(f,nn/dd*Math.PI);a=skill===3?(!Number.isFinite(v)?'Undefined':Math.abs(v)<1e-8?'Zero':v>0?'Positive':'Negative'):(Number.isFinite(v)?math(exact(v)):'Undefined');}
else if(skill===6){const [ff,v]=inverse[index];diagAngle=inv(ff,v);diagFunction=ff;diagInverse=true;q=call('arc'+ff,exact(v));a=angleAnswer(inv(ff,v));}
else if(skill===7){const [ff,nn,dd]=matching[index];diagAngle=inv(ff,nn/dd);diagFunction=ff;diagInverse=true;q=call(ff,call('arc'+ff,rat(nn,dd)));a=ff!=='tan'&&Math.abs(nn/dd)>1?'Undefined over the reals':math(rat(nn,dd));}
else if(skill===8){const [ff,nn,dd]=reverse[index];diagAngle=inv(ff,trig(ff,nn/dd*Math.PI));diagFunction=ff;diagInverse=true;q=call('arc'+ff,call(ff,pi(nn,dd)));a=angleAnswer(inv(ff,trig(ff,nn/dd*Math.PI)));}
else if(skill===9){const [outer,inner,nn,dd,ans]=mixed[index];diagAngle=inv(inner,nn/dd);diagFunction=inner;diagInverse=true;q=call(outer,call('arc'+inner,rat(nn,dd)));a=ans===null?'Undefined':math(ans);}
else{const [outer,inner,nn,dd]=mixedReverse[index];diagAngle=inv(outer,trig(inner,nn/dd*Math.PI));diagFunction=outer;diagInverse=true;q=call('arc'+outer,call(inner,pi(nn,dd)));a=angleAnswer(inv(outer,trig(inner,nn/dd*Math.PI)));}
answer=a;get('question').innerHTML=math(q);get('answer').innerHTML=revealed?answer:'';get('reveal').textContent=revealed?'Hide answer':'Reveal answer';get('item').value=index;renderDiagram();get('status').textContent='Problem '+(index+1)+' of '+(skill===4?9:15)+(skill<=3||skill===5?' · Shared angle bank':' · '+(skill===4?'Special-angle recall':'Composition and inverse bank'));
}
function move(i){const count=skill===4?9:15;index=(i+count)%count;revealed=false;diagramVisible=false;draw()}
get('skill').onchange=()=>{bag=[];skill=Number(get('skill').value);if(skill===4)index%=9;revealed=false;diagramVisible=false;draw()};get('fn').onchange=()=>{revealed=false;diagramVisible=false;draw()};get('item').onchange=()=>move(Number(get('item').value));get('prev').onclick=()=>move(index-1);get('next').onclick=()=>move(index+1);get('random').onclick=()=>{if(!bag.length){bag=Array.from({length:skill===4?9:15},(_,i)=>i).filter(i=>i!==index);for(let j=bag.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[bag[j],bag[k]]=[bag[k],bag[j]];}}move(bag.pop());};get('reveal').onclick=()=>{revealed=!revealed;draw()};draw();

function renderDiagram(){
 const pane=get('diagram');pane.hidden=!diagramVisible;get('toggle-diagram').textContent=diagramVisible?'Hide diagram':'Show diagram';get('toggle-diagram').setAttribute('aria-pressed',String(diagramVisible));
 if(!diagramVisible)return;
 if(!Number.isFinite(diagAngle)){pane.innerHTML='<p><strong>Undefined over the reals</strong></p><p>arcsin and arccos require inputs in [−1, 1]. Tangent is undefined where cos θ = 0. Check the inner expression first.</p>';return;}
 const a=diagAngle,cx=180,cy=180,R=118,x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);
 const path=(lo,hi,r)=>{let p='';for(let j=0;j<=80;j++){const t=lo+(hi-lo)*j/80;p+=(j?' L':'M')+(cx+r*Math.cos(t)).toFixed(2)+' '+(cy-r*Math.sin(t)).toFixed(2);}return p;};
 const normalized=((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI),axis=Math.cos(a)>=0?(Math.sin(a)>=0?0:2*Math.PI):Math.PI;
 let overlay='',caption='';
 if(diagInverse){const lo=diagFunction==='cos'?0:-Math.PI/2,hi=diagFunction==='cos'?Math.PI:Math.PI/2;overlay='<path d="'+path(lo,hi,R+13)+'" fill="none" stroke="#b46820" stroke-width="7" opacity=".65"/>';if(diagFunction==='tan')for(const t of [lo,hi])overlay+='<circle cx="'+(cx+(R+13)*Math.cos(t))+'" cy="'+(cy-(R+13)*Math.sin(t))+'" r="5" fill="#f5f4ef" stroke="#b46820" stroke-width="2"/>';caption='Principal range of arc'+diagFunction+': '+(diagFunction==='cos'?'[0, π]':diagFunction==='sin'?'[−π/2, π/2]':'(−π/2, π/2)')+'. The highlighted arc contains the allowed output angles.';}
 else if(skill===1||skill===5){overlay=Math.abs(Math.sin(2*a))<1e-8?'':'<path d="'+path(axis,normalized,36)+'" stroke="#b46820" stroke-width="4" fill="none"/>';caption='The reference angle is the acute angle between the terminal side and the x-axis. Axis angles have no acute reference angle.';}
 else if(skill===0){caption='π radians = 180°. Multiply the given angle by 180°/π. The diagram shows its terminal side; extra revolutions share that side.';}
 else if(skill===2){caption='Quadrants: I (+,+), II (−,+), III (−,−), IV (+,−). Axis points do not belong to a quadrant.';}
 else{caption='On the unit circle, x = cos θ and y = sin θ. Then tan θ = y/x, provided x ≠ 0.';}
 pane.innerHTML='<svg viewBox="0 0 360 360" role="img" aria-label="Unit circle with terminal side, coordinate projections, and highlighted reference angle or principal range"><circle cx="180" cy="180" r="118" fill="none" stroke="#a6b7b2" stroke-width="2"/><path d="M25 180 H335 M180 25 V335" stroke="#839991" stroke-width="1.5"/><g fill="#657e75" font-size="15" font-family="Arial"><text x="327" y="202">x</text><text x="190" y="30">y</text><text x="255" y="90">I</text><text x="95" y="90">II</text><text x="90" y="280">III</text><text x="250" y="280">IV</text></g>'+overlay+'<path d="M'+x+' 180 V'+y+' H180" fill="none" stroke="#b46820" stroke-dasharray="5 5" stroke-width="2"/><path d="M180 180 L'+x+' '+y+'" stroke="#1c635b" stroke-width="4"/><circle cx="'+x+'" cy="'+y+'" r="6" fill="#1c635b"/><circle cx="180" cy="180" r="3" fill="#152c36"/></svg><p>'+caption+'</p>';
}
get('toggle-diagram').onclick=()=>{diagramVisible=!diagramVisible;renderDiagram()};
get('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await root.requestFullscreen();}catch{get('status').textContent='Use your browser’s full-screen command to expand the board.';}};
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();get('reveal').click()}else if(e.key==='ArrowRight')get('next').click();else if(e.key==='ArrowLeft')get('prev').click();else if(e.key.toLowerCase()==='d')get('toggle-diagram').click();else if(e.key.toLowerCase()==='r')get('random').click();});
})();
</script>
</div>
</body></html>
